<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Preconnect for performance (Core Web Vitals) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Default title & meta (overridden per-page by react-helmet-async) -->

    <link rel="canonical" href="https://voxmation.com/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Voxmation" />
    <meta property="og:url" content="https://voxmation.com/" />
    <meta property="og:title" content="Voxmation — AI Voice Agents &amp; Automation for Home Service Businesses" />

    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Voxmation — AI Voice Agent platform dashboard" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />

    <meta name="twitter:title" content="Voxmation — AI Voice Agents &amp; Automation for Home Service Businesses" />
    <meta name="twitter:description" content="Voxmation deploys AI Voice Agents that answer every call, follow up with every lead, and book appointments 24/7 for HVAC, plumbing, electrical, and home service businesses." />
    <meta name="twitter:image" content="https://voxmation.com/og-image.png" />

    <!-- SoftwareApplication Schema -->
    <script type="application/ld+json">
