# =====================================================================
# NGINX Configuration - Reverse Proxy and Load Balancer
# =====================================================================

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # =====================================================================
    # Logging Configuration
    # =====================================================================
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    # =====================================================================
    # Performance Optimization
    # =====================================================================
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 50M;

    # =====================================================================
    # Gzip Compression
    # =====================================================================
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript
               application/json application/javascript application/xml+rss
               application/rss+xml application/atom+xml image/svg+xml
               text/x-component text/x-cross-domain-policy;

    # =====================================================================
    # Caching Configuration
    # =====================================================================
    proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=backend_cache:10m max_size=1g inactive=60m use_temp_path=off;
    proxy_cache_path /var/cache/nginx/static levels=1:2 keys_zone=static_cache:50m max_size=5g inactive=30d use_temp_path=off;

    # =====================================================================
    # Rate Limiting
    # =====================================================================
    limit_req_zone $binary_remote_addr zone=general_limit:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
    limit_conn_zone $binary_remote_addr zone=addr:10m;

    # =====================================================================
    # Upstream Definitions
    # =====================================================================
    upstream backend {
        server backend:3001 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    upstream frontend {
        server frontend:5000 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    # =====================================================================
    # Health Check Endpoint
    # =====================================================================
    server {
        listen 80;
        server_name localhost;

        location /health {
            access_log off;
            return 200 "OK";
            add_header Content-Type text/plain;
        }
    }

    # =====================================================================
    # Main Server Block - HTTP
    # =====================================================================
    server {
        listen 80;
        server_name _;

        # Redirect to HTTPS in production
        # Uncomment for production with SSL
        # return 301 https://$host$request_uri;

        # =====================================================================
        # Static Assets Caching
        # =====================================================================
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            proxy_pass http://frontend;
            proxy_cache static_cache;
            proxy_cache_valid 200 30d;
            proxy_cache_valid 404 1m;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;

            # Security headers for static assets
            add_header Cache-Control "public, immutable, max-age=2592000";
            add_header X-Content-Type-Options "nosniff";

            access_log off;
        }

        # =====================================================================
        # API Endpoints
        # =====================================================================
        location /api/ {
            limit_req zone=api_limit burst=50;
            limit_conn addr 10;

            proxy_pass http://backend;
            proxy_http_version 1.1;

            # =====================================================================
            # Proxy Headers
            # =====================================================================
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;

            # Connection settings
            proxy_set_header Connection "";
            proxy_http_version 1.1;
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;

            # Buffering
            proxy_buffering off;
            proxy_request_buffering off;

            # Caching for safe methods only
            proxy_cache backend_cache;
            proxy_cache_methods GET HEAD;
            proxy_cache_valid 200 1m;
            proxy_cache_valid 404 1m;
            proxy_cache_bypass $http_pragma $http_authorization;

            # Security headers
            add_header X-Cache-Status $upstream_cache_status;
        }

        # =====================================================================
        # Health Check Endpoints
        # =====================================================================
        location ~ ^/(health|healthz)$ {
            access_log off;
            proxy_pass http://backend;
            proxy_set_header Host $host;
        }

        # =====================================================================
        # Frontend - Catch All (Default)
        # =====================================================================
        location / {
            limit_req zone=general_limit burst=20;
            limit_conn addr 10;

            proxy_pass http://frontend;
            proxy_http_version 1.1;

            # Proxy headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket support
            proxy_set_header Connection "upgrade";
            proxy_set_header Upgrade $http_upgrade;

            # Timeouts
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;

            # Buffering
            proxy_buffering off;

            # Security headers
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-XSS-Protection "1; mode=block" always;
            add_header Referrer-Policy "no-referrer-when-downgrade" always;
            add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        }

        # =====================================================================
        # Security Headers
        # =====================================================================
        # CSP for production (customize as needed)
        # add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' cdn.segment.com; style-src 'self' 'unsafe-inline';" always;

        # HSTS for production only
        # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

        # =====================================================================
        # Block Common Attacks
        # =====================================================================
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }

        location ~ ~$ {
            deny all;
            access_log off;
            log_not_found off;
        }
    }

    # =====================================================================
    # HTTPS Server Block (Uncomment for production)
    # =====================================================================
    # server {
    #     listen 443 ssl http2;
    #     server_name yourdomain.com;

    #     ssl_certificate /etc/nginx/certs/cert.pem;
    #     ssl_certificate_key /etc/nginx/certs/key.pem;

    #     ssl_protocols TLSv1.2 TLSv1.3;
    #     ssl_ciphers HIGH:!aNULL:!MD5;
    #     ssl_prefer_server_ciphers on;
    #     ssl_session_cache shared:SSL:10m;
    #     ssl_session_timeout 10m;

    #     # HSTS
    #     add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    #     # ... rest of configuration same as above ...
    # }

    # =====================================================================
    # HTTP to HTTPS Redirect (Uncomment for production)
    # =====================================================================
    # server {
    #     listen 80;
    #     server_name yourdomain.com;
    #     return 301 https://$server_name$request_uri;
    # }
}
