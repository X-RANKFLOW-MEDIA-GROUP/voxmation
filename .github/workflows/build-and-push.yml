name: Build & Push Docker Images

on:
  push:
    branches:
      - main
    paths:
      - "Dockerfile"
      - "docker-compose.yml"
      - ".dockerignore"
      - ".github/workflows/build-and-push.yml"
      - "src/**"
      - "server/**"
      - "public/**"
      - "package*.json"
  workflow_dispatch:

concurrency:
  group: docker-build-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Prepare and validate Docker build context
  prepare:
    name: Prepare Build Context
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate Dockerfile
        run: |
          if [ ! -f "Dockerfile" ]; then
            echo "Error: Dockerfile not found"
            exit 1
          fi
          echo "Dockerfile validation passed"

      - name: Validate Docker build context
        run: |
          files=("package.json" ".dockerignore")
          for file in "${files[@]}"; do
            if [ ! -f "$file" ]; then
              echo "Warning: $file not found, but continuing"
            fi
          done
          echo "Build context validation passed"

  # Build and push Docker images
  build-and-push:
    name: Build & Push to Registry
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: prepare

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Convert image name to lowercase
        id: lowercase
        run: echo "image=$(echo ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push main image
        id: docker_build_main
        uses: docker/build-push-action@v5
        with:
          context: .
          target: production
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILDKIT_INLINE_CACHE=1

      - name: Build frontend image
        id: docker_build_frontend
        uses: docker/build-push-action@v5
        with:
          context: .
          target: frontend-prod
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.lowercase.outputs.image }}:frontend-latest
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build backend image
        id: docker_build_backend
        uses: docker/build-push-action@v5
        with:
          context: .
          target: backend-prod
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.lowercase.outputs.image }}:backend-latest
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image digest summary
        run: |
          echo "### Docker Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Main Image Digest**: \`${{ steps.docker_build_main.outputs.digest }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Frontend Image Digest**: \`${{ steps.docker_build_frontend.outputs.digest }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Backend Image Digest**: \`${{ steps.docker_build_backend.outputs.digest }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Registry**: ${{ env.REGISTRY }}" >> $GITHUB_STEP_SUMMARY
          echo "**Repository**: ${{ env.IMAGE_NAME }}" >> $GITHUB_STEP_SUMMARY

      - name: Scan image for vulnerabilities
        continue-on-error: true
        run: |
          echo "Image scanning can be integrated with Trivy or similar tools"
          echo "Example: docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy image ..."

  # Notify on completion
  notify:
    name: Notify Build Status
    runs-on: ubuntu-latest
    needs: [build-and-push]
    if: always()

    steps:
      - name: Build Status
        run: |
          if [ "${{ needs.build-and-push.result }}" == "success" ]; then
            echo "Docker build and push completed successfully"
            exit 0
          else
            echo "Docker build and push failed"
            exit 1
          fi
