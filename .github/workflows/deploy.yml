name: Deploy to Production

on:
  push:
    branches:
      - main
  workflow_run:
    workflows: ["Build & Push Docker Images"]
    types:
      - completed
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Pre-deployment validation
  validate:
    name: Pre-Deployment Validation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate deployment config
        run: |
          if [ ! -f "docker-compose.prod.yml" ]; then
            echo "Warning: docker-compose.prod.yml not found"
          fi
          echo "Pre-deployment validation passed"

      - name: Check for required secrets
        run: |
          required_secrets=("DEPLOY_KEY" "DEPLOY_HOST" "DEPLOY_USER")
          for secret in "${required_secrets[@]}"; do
            if [ -z "$(eval echo \${{ secrets.$secret }})" ]; then
              echo "Warning: Secret $secret not configured"
            fi
          done

  # Deploy to production
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: validate

    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true
        if: secrets.DEPLOY_KEY != ''

      - name: Create deployment annotation
        id: deployment
        run: |
          DEPLOYMENT_URL="https://github.com/${{ github.repository }}/deployments"
          echo "deployment_url=$DEPLOYMENT_URL" >> $GITHUB_OUTPUT
          echo "deployment_ref=${{ github.ref }}" >> $GITHUB_OUTPUT

      - name: Deploy via SSH
        run: |
          if [ -z "${{ secrets.DEPLOY_KEY }}" ]; then
            echo "### Deployment Skipped" >> $GITHUB_STEP_SUMMARY
            echo "Deploy key not configured. To enable production deployment:" >> $GITHUB_STEP_SUMMARY
            echo "1. Add DEPLOY_KEY secret to repository" >> $GITHUB_STEP_SUMMARY
            echo "2. Add DEPLOY_HOST secret (server hostname/IP)" >> $GITHUB_STEP_SUMMARY
            echo "3. Add DEPLOY_USER secret (SSH username)" >> $GITHUB_STEP_SUMMARY
            echo "4. Configure deployment script on server" >> $GITHUB_STEP_SUMMARY
            exit 0
          fi

          ssh -v \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
            "cd /app && docker-compose -f docker-compose.prod.yml pull && docker-compose -f docker-compose.prod.yml up -d" || {
            echo "### Deployment Failed" >> $GITHUB_STEP_SUMMARY
            echo "SSH deployment command failed. Check logs above." >> $GITHUB_STEP_SUMMARY
            exit 1
          }
        continue-on-error: true

      - name: Health check
        run: |
          if [ -z "${{ secrets.DEPLOY_HOST }}" ]; then
            echo "Skipping health check - deployment host not configured"
            exit 0
          fi

          echo "Waiting for application to be healthy..."
          max_attempts=30
          attempt=0

          while [ $attempt -lt $max_attempts ]; do
            if ssh ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
              "curl -sf http://localhost:5000/health || curl -sf http://localhost:3001/health" > /dev/null 2>&1; then
              echo "Application is healthy"
              exit 0
            fi
            attempt=$((attempt + 1))
            echo "Health check attempt $attempt/$max_attempts..."
            sleep 10
          done

          echo "### Health Check Failed" >> $GITHUB_STEP_SUMMARY
          echo "Application did not become healthy after deployment." >> $GITHUB_STEP_SUMMARY
          exit 1
        continue-on-error: true

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/id_rsa

      - name: Create deployment status
        if: always()
        run: |
          status="failure"
          if [ "${{ job.status }}" == "success" ]; then
            status="success"
          fi

          echo "### Deployment Status: $status" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch**: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Author**: ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Timestamp**: $(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_STEP_SUMMARY

  # Post-deployment tasks
  post-deploy:
    name: Post-Deployment Tasks
    runs-on: ubuntu-latest
    needs: deploy
    if: always()

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate deployment report
        run: |
          echo "### Deployment Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Deploy Status**: ${{ needs.deploy.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "#### Deployment Information" >> $GITHUB_STEP_SUMMARY
          echo "- Image: \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Commit: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Branch: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "#### Next Steps" >> $GITHUB_STEP_SUMMARY
          echo "- Monitor application logs" >> $GITHUB_STEP_SUMMARY
          echo "- Run smoke tests" >> $GITHUB_STEP_SUMMARY
          echo "- Verify all services are running" >> $GITHUB_STEP_SUMMARY

      - name: Notify deployment channel
        continue-on-error: true
        run: |
          # This can be integrated with Slack, Discord, or other notification services
          echo "Deployment notification can be sent to your preferred channel"
          echo "Integrate with Slack/Discord/PagerDuty for real-time alerts"
